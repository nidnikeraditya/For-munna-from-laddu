body::before{content:"";position:fixed;inset:0;background:var(--veil);backdrop-filter:blur(2px)}
.card{position:relative;z-index:2;background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:22px;max-width:460px;width:100%;max-height:92%;display:flex;flex-direction:column;padding:30px 24px 22px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.emo{font-size:38px;margin-bottom:8px}
h1{font-size:27px;margin:0 0 12px;font-weight:normal}
.txt{overflow-y:auto;-webkit-overflow-scrolling:touch;margin-bottom:20px;padding:0 4px}
p{font-size:18px;line-height:1.55;margin:0 0 12px;white-space:pre-line}
.long p{text-align:left;font-size:16.5px}
.btns{display:flex;flex-direction:column;gap:10px}
button{font:inherit;font-size:17px;border:0;border-radius:999px;padding:14px 22px;cursor:pointer;background:var(--accent);color:var(--accent-fg)}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
.dots{display:flex;justify-content:center;gap:7px;margin-top:18px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.fade{animation:f .5s ease;display:flex;flex-direction:column;min-height:0}
@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fl{position:fixed;bottom:-40px;z-index:1;font-size:24px;opacity:.85;animation:up linear forwards;pointer-events:none}
@keyframes up{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.fade,.fl{animation:none}.fl{display:none}}
</style>

var steps=[
{e:"🥺",h:"I’m so sorry.",p:"I made this page just for you. Only you.\nBecause a simple “sorry” felt too small for what I did 💔"},
{e:"💔",h:"I hurt you.",p:"The words I said were wrong, and they hurt you deeply. I’m not going to make excuses or turn it around on you. That’s on me. 🙏"},
{e:"🪞",h:"What I said, and the truth",p:"I said you never changed.\nThe truth: you’ve done so much for me, and I’m better because of you. ✨\n\nI said you disturb my peace.\nThe truth: you are my peace. 🕊️\n\nI called you dumb and said you lack critical thinking.\nThe truth: that was cruel and untrue, and I’m ashamed I said it. 💔\n\nI said you play the victim.\nThe truth: your feelings are real, and I had no right to dismiss them. 🤍"},
{e:"💌",h:"My letter to you",long:1,p:["I made this page just for you, because a simple “sorry” felt far too small for what I did. I’ve replayed our fight again and again, and every time I come back to the same truth: I was wrong. I said things I should never have said, and I said them to the person who means the most to me. I let my anger speak louder than my love, and I hurt you so much. I can’t take those words back, and I wish with all my heart that I could.","I told you that you never changed, when the truth is you have done so much for me, and I’m a better person because of you. I said you disturbed my peace, when you are my peace. I called you dumb and said you lack critical thinking, which was cruel, unfair, and untrue. And I accused you of playing the victim, when what you deserved was for me to listen to how you felt. Even in the middle of anger, I had no right to say any of it, and I’m ashamed that I did.","I’m not trying to excuse myself or explain it away. There is no excuse for making you feel small, unheard, or unloved. You deserve gentleness, patience, and respect, and in that moment I gave you none of them. I’m truly sorry, not because I’m afraid of losing you, but because I hate that I caused you pain. It hurts me to know that my words may stay with you long after the fight is over.","I want to change, and not just for a day or a week. I want to learn to pause when I’m upset, to listen before I react, and to speak to you with the same kindness I want you to receive from me. I want to take responsibility instead of getting defensive, and to talk things through instead of letting them explode. I want to grow into a better partner and a better person, and to do better in life, in how I treat people, in how I handle my emotions, and in who I choose to be every single day.","You make me want to be better. I’m not asking you to forget what happened, or to forgive me right away. Take all the time you need. All I ask is a chance to show you, with my actions and not just my words, that I mean every single word of this. I love you, and I’m so sorry. 🥺🌹"]},
{e:"🌹",h:"What I’ll do",p:"I’ll listen to you fully, without defending myself 👂\nI’ll think before I speak when I’m angry 🤍\nI’ll keep working to be better for you, and for me 🫶"},
{e:"🫶",h:"Can we talk?",p:"Whenever you’re ready. No pressure, no rush. 💞",end:1}
];
var i=0,card=document.getElementById("card");
function render(){
var s=steps[i],dots="",k;
for(k=0;k<steps.length;k++)dots+='<i class="'+(k===i?"on":"")+'"></i>';
var body=s.long?s.p.map(function(t){return"<p>"+t+"</p>"}).join(""):"<p>"+s.p+"</p>";
var btns=s.end?'<div class="btns"><button id="yes">I’m ready to talk 💬</button><button class="alt" id="time">I need a little time 🕊️</button></div>':'<div class="btns"><button id="next">Continue</button></div>';
card.innerHTML='<div class="fade"><div class="emo">'+s.e+'</div><h1>'+s.h+'</h1><div class="txt'+(s.long?" long":"")+'">'+body+'</div>'+btns+'</div><div class="dots">'+dots+'</div>';
if(s.end){
document.getElementById("yes").onclick=function(){done("Thank you. I love you, and I’m here whenever you want to talk. 💖");burst()};
document.getElementById("time").onclick=function(){done("Of course. Take all the time you need. I’ll be here, and I love you. 🤍")};
}else{document.getElementById("next").onclick=function(){i++;render()}}
}
function done(m){card.innerHTML='<div class="fade"><div class="emo">💖</div><h1>Thank you</h1><div class="txt"><p>'+m+'</p></div></div>'}
function burst(){var a=["💖","🥺","🌹","💌","🫶","💞"],n;for(n=0;n<24;n++)(function(n){setTimeout(function(){var d=document.createElement("div");d.className="fl";d.textContent=a[n%a.length];d.style.left=Math.random()*92+"%";d.style.animationDuration=(4+Math.random()*3)+"s";document.body.appendChild(d);setTimeout(function(){d.remove()},7500)},n*120)})(n)}
render();
</script>
</body>
</html>
